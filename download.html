<body style="background:#121212; color:white; text-align:center; font-family:Arial;">

<h2>{{ game['name'] }}</h2>
<p>Watch ads to unlock download</p>

<!-- FULL SCREEN AD -->
<div id="adOverlay" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
z-index:9999;
color:white;
">

    <!-- Skip button -->
    <div style="position:absolute; top:20px; right:20px;">
        <button id="skipBtn" onclick="skipAd()" disabled>
            Skip (15)
        </button>
    </div>

    <!-- Ad content -->
    <div style="
    display:flex;
    justify-content:center;
    align-items:center;
    height:100%;
    flex-direction:column;
    ">

        <h2>📢 Advertisement</h2>

        <!-- YOUR AD CONTENT -->
        <a href="https://example.com" target="_blank">
            <img src="https://via.placeholder.com/300x250?text=Your+Ad" style="border-radius:10px;">
        </a>

        <p>Click ad to support us</p>

    </div>
</div>

<!-- DOWNLOAD BUTTON -->
<a id="downloadBtn" href="{{ game['link'] }}" style="display:none;">
    <button onclick="downloadGame()">Download Now</button>
</a>

<script>
let adsWatched = 0;
let skipTime = 15;
let timer;

// SHOW AD
function showAd(){
    if(adsWatched >= 7) return;

    let overlay = document.getElementById("adOverlay");
    let skipBtn = document.getElementById("skipBtn");

    overlay.style.display = "block";
    skipTime = 15;
    skipBtn.disabled = true;
    skipBtn.innerText = "Skip (" + skipTime + ")";

    timer = setInterval(()=>{
        skipTime--;
        skipBtn.innerText = "Skip (" + skipTime + ")";

        if(skipTime <= 0){
            skipBtn.disabled = false;
            skipBtn.innerText = "Skip Ad";
            clearInterval(timer);
        }
    },1000);
}

// SKIP AD
function skipAd(){
    document.getElementById("adOverlay").style.display = "none";
    adsWatched++;

    if(adsWatched >= 7){
        document.getElementById("downloadBtn").style.display = "block";
    }
}

// START FIRST AD
showAd();

// REPEAT EVERY 10s
let interval = setInterval(()=>{
    if(adsWatched < 7){
        showAd();
    } else {
        clearInterval(interval);
    }
},10000);

// DOWNLOAD COUNTER
function downloadGame(){
    fetch("/increase_download/{{ game['id'] }}", {
        method:"POST"
    });
}
</script>

</body>
