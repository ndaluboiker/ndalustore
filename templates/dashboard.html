<!-- templates/dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - NdaluStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h1 class="mb-4">NdaluStore Admin Dashboard</h1>
    <a href="/logout" class="btn btn-danger mb-3">Logout</a>

    <!-- UPLOAD NEW GAME -->
    <div class="card mb-4">
        <div class="card-header">Upload New Game</div>
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <input type="hidden" name="upload" value="1">
                <div class="mb-3">
                    <label>Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Category</label>
                    <input type="text" name="category" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Video URL (optional)</label>
                    <input type="text" name="video" class="form-control">
                </div>
                <div class="mb-3">
                    <label>Image File</label>
                    <input type="file" name="image" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Game File</label>
                    <input type="file" name="gamefile" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Upload Game</button>
            </form>
        </div>
    </div>

    <!-- LIST OF GAMES -->
    <div class="card">
        <div class="card-header">All Games</div>
        <div class="card-body">
            <table class="table table-bordered table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Video URL</th>
                    <th>Downloads</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                {% for g in games %}
                <tr>
                    <td>{{ g.id }}</td>
                    <td><img src="{{ url_for('static', filename='uploads/' + g.image) }}" width="80"></td>
                    <td>{{ g.name }}</td>
                    <td>{{ g.category }}</td>
                    <td>{{ g.video }}</td>
                    <td>{{ g.download_count }}</td>
                    <td>
                        <!-- Delete -->
                        <form method="POST" style="display:inline-block;">
                            <input type="hidden" name="delete_id" value="{{ g.id }}">
                            <button class="btn btn-sm btn-danger" onclick="return confirm('Delete this game?')">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
